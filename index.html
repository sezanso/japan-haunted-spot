<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本心霊スポット調査</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #dcdcdc;
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .menu-btn {
            border: 1px solid #555;
            padding: 6px 12px;
            color: #fff;
            font-size: 0.9rem;
            background: #1a1a1a;
        }
        .sns-btn {
            color: #1da1f2;
            font-weight: bold;
            font-size: 1.2rem;
            text-decoration: none;
        }
        h2 {
            color: #ff3333;
            font-size: 1.1rem;
            border-left: 3px solid #ff3333;
            padding-left: 8px;
            margin-top: 20px;
        }
        p {
            font-size: 0.95rem;
            margin-bottom: 16px;
        }
        .highlight {
            color: #ff3333;
            font-weight: bold;
        }
        .top-btn {
            display: block;
            text-align: center;
            background-color: #333;
            color: #fff;
            padding: 10px;
            margin-top: 40px;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-btn">MENU</div>
        <a href="#" class="sns-btn">𝕏</a>
    </header>

    <main>
        <h2>◆イントロダクション</h2>
        <p>
            2006年、インターネット上に投稿され、瞬く間に語り継がれる最恐の都市伝説となった<span class="highlight">「〇〇の廃墟」</span>が、ついに調査解禁！
        </p>
        <p>
            ある山奥へ足を踏み入れた投稿者が目にしたのは、そこにあるはずのない名前の看板と、異様な雰囲気を放つ建造物だった——。全国に眠る禁足地や、噂の絶えない心霊スポットの真相に迫る。
        </p>
    </main>

    <a href="#" class="top-btn">▲ TOP</a>

</body>
</html>
